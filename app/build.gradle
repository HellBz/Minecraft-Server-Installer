plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

configurations {
    packIntoJAR
}

dependencies {
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JSON processing
    implementation 'org.json:json:20240303'
    packIntoJAR 'org.json:json:20240303'
    
    // Gson for JSON processing
    implementation 'com.google.code.gson:gson:2.10.1'
    packIntoJAR 'com.google.code.gson:gson:2.10.1'

    // Guava utilities
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'org.codehaus.groovy:groovy-json:3.0.9'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// Handle duplicate files in JAR
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

application {
    // Define the main class for the application.
    mainClass = 'dev.cubie.CubeServerTool.CubeServerTool'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

apply plugin: 'java'

import java.text.SimpleDateFormat

// Pfad zur JSON-Datei im res-Ordner
def versionFile = file('src/main/resources/installerInfo.json')

// Lese die JSON-Datei als Text
def jsonText = versionFile.text
// Extrahiere die Version mit regulären Ausdrücken
def matcher = jsonText =~ /"version"\s*:\s*"([^"]+)"/
def version = matcher.find() ? matcher[0][1] : '1.0.0'

// Setze die Version für das Projekt
project.version = version

import java.text.SimpleDateFormat
// Erstelle einen Timestamp
def timestamp = new SimpleDateFormat("yyyyMMddHHmmss").format(new Date())

def timestampOnlyDay = new SimpleDateFormat("yyyy-MM-dd").format(new Date())

jar {
    // Optional: Setze den vollständigen Namen der JAR-Datei
    archiveBaseName.set("${timestamp}-${rootProject.name}") // Verwendet den Namen des Root-Projekts

    // Setze das Verzeichnis, in dem die JAR-Datei gespeichert werden soll
    destinationDirectory.set(file("compiled_all/${timestampOnlyDay}/${project.version}/"))
    manifest {
        attributes(
                'Main-Class': "dev.cubie.CubeServerTool.CubeServerTool"
        )
    }

    // Füge nur die Abhängigkeiten aus der customRuntime-Konfiguration ein
    from {
        configurations.packIntoJAR.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    // Inkludiere die kompilierten Klassen aus dem Projekt
    from(sourceSets.main.output)

    // Inkludiere alle Ressourcen aus dem Modules-Ordner (z. B. XML, JSON)
    from(file('src/main/java/dev/cubie/CubeServerTool/Modules')) {
        include '**/*'
        exclude '**/*.java' // Schließt die .java-Dateien aus, da diese kompiliert werden
        into 'dev/cubie/CubeServerTool/Modules'
    }

    // Kopiere die JAR-Datei nach der Erstellung in einen anderen Ordner
    doLast {

        delete file('compiled/cst_data/config') // Pfad zum Zielordner
        delete file('compiled/cst_data/logs') // Pfad zum Zielordner
        delete file('compiled/cst_data/temp') // Pfad zum Zielordner
        copy {
            from archiveFile.get().asFile // Die erstellte JAR-Datei
            into 'compiled/' // Zielverzeichnis
            rename { fileName ->
                "${rootProject.name}.jar" // Entfernt das Versionsmuster
            }
        }
    }

}

// Registriere den Task zum Erstellen der zusätzlichen Datei
tasks.register('createStartFile') {

    def outputFile = file("compiled_all/${timestampOnlyDay}/${project.version}/_start_.bat")
    doLast {
        outputFile.parentFile.mkdirs()
        outputFile.text = """
        @echo off
        echo Build Date: ${new Date()}
        echo Project Name: ${rootProject.name}
        java -jar ${timestamp}-${rootProject.name}-${project.version}.jar
        pause
        """
        println "Created file: ${outputFile.path}"
    }

    //Create Start-File to Current
    def outputFile_cur = file("compiled/_start_.bat")
    doLast {
        outputFile_cur.parentFile.mkdirs()
        outputFile_cur.text = """
        @echo off
        echo Project Name: ${rootProject.name}
        java -jar ${rootProject.name}.jar
        pause
        """
        println "Created file: ${outputFile_cur.path}"
    }

    //Create Start-File to Current
    def outputFile_cur_sh = file("compiled/_start_.sh")
    doLast {
        outputFile_cur_sh.parentFile.mkdirs()
        outputFile_cur_sh.text = """
        #!/bin/bash
        echo "Project Name: ${rootProject.name}"
        java -jar Minecraft-Server-Installer.jar
        read -p "Press any key to continue..."
        """
        println "Created file: ${outputFile_cur_sh.path}"
    }

}

// Kompiliere die Hauptklassen im Standard-Build-Prozess
sourceSets.main.java.srcDirs = ['src/main/java']

// Task für das Kompilieren der Modules
tasks.register('compileModules', JavaCompile) {
    source = fileTree('src/main/java/dev/cubie/CubeServerTool/Modules') {
        include '**/*.java'
    }
    classpath = sourceSets.main.output + configurations.compileClasspath
    destinationDir = file("$buildDir/classes/CubeServerTool/Modules")

    doFirst {
        println "Compiling module sources..."
        source.each { println it }
    }
}


// Definiere den buildModules-Task
tasks.register('buildModules') {
    dependsOn 'build' // Stellt sicher, dass das gesamte Projekt zuerst gebaut wird
    dependsOn 'compileModules'
    doLast {
        println "All modules have been built."
    }
}

// Registriere JAR-Tasks für die Modules
file('src/main/java/dev/cubie/CubeServerTool/Modules').eachDir { dir ->
    def jarTaskName = "compileModule_${dir.name}"
    tasks.register(jarTaskName, Jar) {
        dependsOn 'compileModules'
        archiveBaseName.set("${dir.name}")

        // Füge die kompilierten Klassen hinzu
        from(file("$buildDir/classes/CubeServerTool/Modules/dev/cubie/CubeServerTool/Modules/${dir.name}")) {
            include '**/*'
            // Entferne den führenden Pfad, um die richtige Struktur in der JAR zu bekommen
            into "dev/cubie/CubeServerTool/Modules/${dir.name}"
        }
        destinationDirectory.set(file("compiled_all/${timestampOnlyDay}/${project.version}/cst_data/modules/"))

        // Füge alle anderen Dateien aus dem Plugin-Ordner hinzu (Bilder, XML, JSON, etc.)
        from(dir) {
            include '**/*' // Schließt alle Dateien ein
            exclude '**/*.java' // Schließt die .java-Dateien aus, da diese kompiliert wurden
            into "dev/cubie/CubeServerTool/Modules/${dir.name}"
        }

        manifest {
            attributes(
                    'Main-Class': "dev.cubie.CubeServerTool.Modules.${dir.name}.${dir.name}"
            )
        }
    }

    tasks.named('buildModules').configure {
        dependsOn jarTaskName
    }
}

// Stellt sicher, dass der Build-Prozess den Plugin-Build und die Dateierstellung umfasst
tasks.named('build') {
    dependsOn 'createStartFile' // , 'buildModules'
}

task customFatJar(type: Jar) {
    manifest {
        attributes 'Main-Class': "dev.cubie.CubeServerTool.CubeServerModule"
    }
    archiveBaseName = 'all-in-one-jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

// Task zum Löschen des Zielverzeichnisses
task cleanOutputDir(type: Delete) {
    delete file('compiled/cst_data/modules/') // Pfad zum Zielordner
    delete file('compiled/cst_data/config') // Pfad zum Zielordner
    delete file('compiled/cst_data/logs') // Pfad zum Zielordner
    delete file('compiled/cst_data/temp') // Pfad zum Zielordner
}

// Task zum Kopieren der JAR-Dateien
task copyJarsToOutputDir(type: Copy) {
    dependsOn 'buildModules' // Task wird nach dem Build aufgerufen
    from(file("compiled_all/${timestampOnlyDay}/${project.version}/cst_data/modules/")) // Ursprünglicher Ordner mit den JARs
    into file('compiled/cst_data/modules/') // Zielordner
    include '**/*.jar' // Kopiere nur JAR-Dateien
    // Umbenennen der Dateien beim Kopieren, entfernt den Versionsanteil
    rename { fileName ->
        fileName.replaceAll("-${project.version}", '') // Entfernt das Versionsmuster
    }
}

// Verknüpfe beide Tasks: Zuerst löschen, dann kopieren
copyJarsToOutputDir.dependsOn cleanOutputDir

// Task-Reihenfolge sicherstellen
buildModules.finalizedBy(copyJarsToOutputDir)